<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editing Pending Images</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f8fa;
      color: #263238;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      color: #7b8794;
      font-size: 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 16px;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 13px;
      white-space: nowrap;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .refresh-btn {
      border: 1px solid #d9dee3;
      background: #fff;
      color: #344454;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .refresh-btn:hover {
      background: #f5f7f9;
    }

    .refresh-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    /* Only dealer rows scroll. Header + Total stay frozen. */
    .table-scroll {
      height: 720px;
      overflow-y: auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #edf0f2;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      color: #6f7c88;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      background: #fff;
    }

    .number {
      width: 60px;
      text-align: right;
      color: #9aa4ad;
    }

    .name {
      font-weight: 600;
      color: #52606d;
    }

    .total {
      width: 160px;
      text-align: right;
      font-weight: 600;
      color: #4f5d68;
    }

    .fixed-table {
      position: relative;
      z-index: 2;
      background: #fff;
    }

    .fixed-table th {
      border-bottom: 1px solid #dfe4e8;
    }

    .total-row td {
      font-weight: 700;
      color: #344454;
      background: #fafbfc;
      border-bottom: 1px solid #dfe4e8;
    }

    .total-row .total {
      font-weight: 700;
    }

    .empty {
      padding: 40px !important;
      text-align: center;
      color: #8b969f;
    }

    .footer {
      padding: 11px 16px;
      border-top: 1px solid #e6e9ed;
      color: #8a949d;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    @media (max-width: 700px) {
      .page { padding: 18px 12px 28px; }
      .header { flex-direction: column; }
      .actions { width: 100%; justify-content: flex-end; }
      .table-scroll { height: 720px; }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <div>
        <h1>Editing Pending Images</h1>
        <p class="subtitle">Metabase Question #6501 · manual refresh</p>
      </div>

      <div class="actions">
        <div id="status" class="status">
          <span class="dot"></span>
          <span>Loading…</span>
        </div>

        <button id="refreshBtn" class="refresh-btn" onclick="loadData(true)">
          Refresh Data
        </button>
      </div>
    </header>

    <section class="card">

      <!-- Frozen header + frozen Total row -->
      <div class="fixed-table">
        <table>
          <thead>
            <tr>
              <th class="number">#</th>
              <th>name</th>
              <th class="total">total_images</th>
            </tr>
          </thead>

          <tbody>
            <tr class="total-row">
              <td class="number">—</td>
              <td class="name">Total</td>
              <td class="total" id="grandTotal">0</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Dealer rows scroll -->
      <div class="table-scroll">
        <table>
          <tbody id="tbody">
            <tr>
              <td colspan="3" class="empty">Loading data…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="footer">
        <span id="rowCount">0 rows</span>
        <span id="refresh">Last refresh: —</span>
      </div>

    </section>
  </main>

  <script>
    let payload = { columns: [], rows: [] };

    const esc = value =>
      String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c]));

    function setStatus(text, error = false) {
      const status = document.getElementById("status");
      status.className = "status" + (error ? " error" : "");
      status.innerHTML =
        '<span class="dot"></span><span>' + esc(text) + '</span>';
    }

    function render() {
      const columns = Array.isArray(payload.columns) ? payload.columns : [];
      const rows = Array.isArray(payload.rows) ? payload.rows : [];

      const nameIndex = Math.max(
        0,
        columns.findIndex(c => String(c.name || "").toLowerCase() === "name")
      );

      const totalIndex = Math.max(
        0,
        columns.findIndex(c => String(c.name || "").toLowerCase() === "total_images")
      );

      const mapped = rows.map(row => ({
        name: row[nameIndex],
        total: Number(row[totalIndex]) || 0
      }));

      /*
       * Metabase can return a first row like:
       * [null, 98]
       * where null = Total and 98 = grand total.
       *
       * Use that row as the frozen Total instead of adding it
       * to the dealer rows.
       */
      const totalSource = mapped.find(
        row => row.name == null && Number.isFinite(row.total)
      );

      const dealers = mapped
        .filter(row => row !== totalSource)
        .sort((a, b) => b.total - a.total);

      const grandTotal = totalSource
        ? totalSource.total
        : dealers.reduce((sum, row) => sum + row.total, 0);

      document.getElementById("grandTotal").textContent =
        grandTotal.toLocaleString();

      document.getElementById("tbody").innerHTML = dealers.length
        ? dealers.map((row, index) => `
            <tr>
              <td class="number">${index + 1}</td>
              <td class="name">${esc(row.name) || "Unknown"}</td>
              <td class="total">${row.total.toLocaleString()}</td>
            </tr>
          `).join("")
        : `
          <tr>
            <td colspan="3" class="empty">No records found</td>
          </tr>
        `;

      document.getElementById("rowCount").textContent =
        `${dealers.length.toLocaleString()} rows · scroll for more`;

      const refreshTime = payload.fetchedAt
        ? new Date(payload.fetchedAt).toLocaleString()
        : "—";

      document.getElementById("refresh").textContent =
        "Last refresh: " + refreshTime;
    }

    async function loadData(showLoading = false) {
      const button = document.getElementById("refreshBtn");

      if (showLoading) {
        button.disabled = true;
        button.textContent = "Refreshing…";
        setStatus("Loading…");
      }

      try {
        const response = await fetch("data.json?ts=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        payload = await response.json();
        render();
        setStatus("Live data");

      } catch (error) {
        console.error("Dashboard data load failed:", error);
        setStatus("Data unavailable", true);

      } finally {
        button.disabled = false;
        button.textContent = "Refresh Data";
      }
    }

    // Initial load only. No automatic 5-minute refresh.
    loadData();
  </script>
</body>
</html>
